<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Notifications Center</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/global-2026.css">
</head>
<body>
<main class="shell">
  <header class="hero"><div class="brand-mark" aria-hidden="true">◉</div><div><p class="eyebrow">CHAIN//LAB ALERTS</p><h1>Notifications Center</h1><p class="subtitle">One feed for background-job completion, activity matches, provider waits and important research events.</p></div></header>
  <section class="panel">
    <div class="panel-heading history-heading"><div><p class="step">INBOX</p><h2>Your research notifications</h2></div><div class="actions" style="margin-top:0"><button id="notif-refresh" class="secondary" type="button">Refresh</button><button id="notif-read-all" class="primary" type="button">Mark all read</button></div></div>
    <p id="notif-status" class="field-help">Loading notifications…</p>
    <div id="notif-list" style="display:grid;gap:12px;margin-top:16px"></div>
  </section>
</main>
<script src="/site-pages.js" defer></script>
<script src="/global-ui.js" defer></script>
<script src="/user-shell.js" defer></script>
<script src="/notifications.js" defer></script>
</body>
</html>
