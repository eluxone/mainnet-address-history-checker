name: QA 2026 UI Lite
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  qa:
    if: github.event.head_commit.message != 'QA 2026 UI lite browser and mobile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Find Chrome
        id: chrome
        run: |
          if command -v google-chrome >/dev/null; then echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"; exit 0; fi
          if command -v chromium >/dev/null; then echo "path=$(command -v chromium)" >> "$GITHUB_OUTPUT"; exit 0; fi
          if command -v chromium-browser >/dev/null; then echo "path=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Chrome not found" >&2
          exit 1
      - name: Wait for production
        run: |
          for i in $(seq 1 48); do
            if curl -fsS --max-time 10 https://portofele.vercel.app/ >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "Production URL did not become reachable" >&2
          exit 1
      - name: Install lightweight browser driver
        run: npm install --no-save puppeteer-core@24.16.0
      - name: Run desktop and phone QA
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          mkdir -p qa
          cat > /tmp/qa.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
          const base='https://portofele.vercel.app';
          const paths=['/','/btc','/recover','/btc-research.html','/login.html'];
          const rows=[];
          async function test(mode,width,height){
            for(const path of paths){
              const page=await browser.newPage();
              await page.setViewport({width,height,deviceScaleFactor:1});
              const jsErrors=[];page.on('pageerror',e=>jsErrors.push(e.message));
              const response=await page.goto(base+path,{waitUntil:'networkidle2',timeout:60000});
              if(!response?.ok()) throw new Error(`${mode} ${path}: HTTP ${response?.status()}`);
              await page.waitForSelector('.crypto-global-nav',{timeout:15000});
              const intro=await page.$('.crypto-intro');
              if(intro){
                const line=await page.$eval('.crypto-intro h1',el=>el.textContent.trim());
                if(line!=='Step into the anonymous world') throw new Error(`${mode} ${path}: hero text mismatch: ${line}`);
                await page.click('.crypto-enter');await new Promise(r=>setTimeout(r,900));
              }
              const navCount=await page.$$eval('.crypto-menu-item',els=>els.length);
              if(navCount!==5) throw new Error(`${mode} ${path}: expected 5 menu items, got ${navCount}`);
              if(mode==='desktop'){
                const visible=await page.$eval('.crypto-tools-button',el=>getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().width>0);
                if(!visible) throw new Error(`${path}: desktop All tools button hidden`);
                await page.click('.crypto-tools-button');
                const open=await page.$eval('.crypto-tools-menu',el=>el.classList.contains('open')&&getComputedStyle(el).display!=='none');
                if(!open) throw new Error(`${path}: desktop tools menu failed to open`);
              } else {
                const visible=await page.$eval('.crypto-mobile-toggle',el=>getComputedStyle(el).display!=='none'&&el.getBoundingClientRect().width>0);
                if(!visible) throw new Error(`${path}: hamburger hidden on phone`);
                await page.click('.crypto-mobile-toggle');
                const open=await page.$eval('.crypto-mobile-drawer',el=>el.classList.contains('open'));
                if(!open) throw new Error(`${path}: mobile drawer failed to open`);
                const mobileLinks=await page.$$eval('.crypto-mobile-link',els=>els.length);
                if(mobileLinks!==5) throw new Error(`${path}: expected 5 phone links, got ${mobileLinks}`);
              }
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              if(overflow>3) throw new Error(`${mode} ${path}: ${overflow}px horizontal overflow`);
              if(jsErrors.length) throw new Error(`${mode} ${path}: ${jsErrors.join(' | ')}`);
              rows.push({mode,path,navCount,overflow});
              if(path==='/'&&mode==='desktop')await page.screenshot({path:'qa/desktop-home.png',fullPage:true});
              if(path==='/'&&mode==='phone')await page.screenshot({path:'qa/phone-home.png',fullPage:true});
              await page.close();
            }
          }
          const introPage=await browser.newPage();await introPage.setViewport({width:1440,height:1000});await introPage.goto(base+'/',{waitUntil:'networkidle2'});await introPage.waitForSelector('.crypto-intro');await introPage.screenshot({path:'qa/intro-animation.png',fullPage:false});await introPage.close();
          await test('desktop',1440,1000);await test('phone',390,844);await browser.close();
          const md=['# 2026 UI Production QA','','Production: '+base,'','| Mode | Page | Result | Menu links | Horizontal overflow |','|---|---|---|---:|---:|',...rows.map(r=>`| ${r.mode} | ${r.path} | PASS | ${r.navCount} | ${r.overflow}px |`),'','Verified hero line: **Step into the anonymous world**.','Verified desktop All Tools menu, phone hamburger drawer, all five repository pages, and body-level responsive overflow.'];
          fs.writeFileSync('qa/QA_2026_UI.md',md.join('\n'));
          JS
          node /tmp/qa.mjs
      - name: Commit QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/
          git diff --cached --quiet || git commit -m "QA 2026 UI lite browser and mobile"
          git push
