name: Raise BTC candidate limit to 10000

on:
  push:
    paths:
      - '.github/workflows/raise-btc-candidate-limit.yml'

permissions:
  contents: write

jobs:
  update-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Raise candidate limit consistently
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'btc-discovery.html': [('max="5000"', 'max="10000"')],
              'btc-discovery.js': [('candidateLimit, 10, 5_000', 'candidateLimit, 10, 10_000')],
              'api/btc-discovery-v2.mjs': [('const MAX_CANDIDATES = 5_000;', 'const MAX_CANDIDATES = 10_000;')],
              'api/btc-discovery-v3.mjs': [('const MAX_CANDIDATES = 5_000;', 'const MAX_CANDIDATES = 10_000;')],
              'api/btc-preview.mjs': [('const MAX_CANDIDATES = 5_000;', 'const MAX_CANDIDATES = 10_000;')],
              'api/btc-background-jobs.mjs': [('const MAX_CANDIDATES = 5000;', 'const MAX_CANDIDATES = 10000;')],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected pattern not found in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          # Remove this one-shot workflow after it has done its job.
          Path('.github/workflows/raise-btc-candidate-limit.yml').unlink()
          PY
      - name: Verify 10,000 candidate cap
        run: |
          grep -q 'max="10000"' btc-discovery.html
          grep -q 'candidateLimit, 10, 10_000' btc-discovery.js
          grep -q 'MAX_CANDIDATES = 10_000' api/btc-discovery-v3.mjs
          grep -q 'MAX_CANDIDATES = 10_000' api/btc-preview.mjs
          grep -q 'MAX_CANDIDATES = 10000' api/btc-background-jobs.mjs
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Raise BTC candidate limit to 10000'
          git push
