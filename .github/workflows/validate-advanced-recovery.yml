name: Validate advanced recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message != 'Validate advanced recovery workbench'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run project and recovery checks
        run: npm run check
      - name: Record successful validation and clean workflow
        run: |
          mkdir -p qa
          printf 'Advanced Recovery Workbench validation: PASS\nBTC BIP44: PASS\nBTC BIP49: PASS\nBTC BIP84: PASS\nETH BIP44: PASS\n' > qa/advanced-recovery-validation.txt
          rm -f .github/workflows/validate-advanced-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/advanced-recovery-validation.txt .github/workflows/validate-advanced-recovery.yml
          git commit -m "Validate advanced recovery workbench"
          git push
