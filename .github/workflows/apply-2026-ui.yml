name: Apply shared 2026 UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply shared 2026 UI across site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate page map and inject assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('.')
          pages=[]
          route_map={
            'index.html':'/',
            'btc-discovery.html':'/btc',
            'recovery-assistant.html':'/recover',
          }
          short_map={
            'index.html':'EVM Auditor',
            'btc-discovery.html':'BTC Discovery',
            'btc-research.html':'BTC Workspace',
            'recovery-assistant.html':'Seed Recovery',
          }
          for p in sorted(root.glob('*.html')):
            text=p.read_text(encoding='utf-8')
            m=re.search(r'<title>(.*?)</title>',text,re.I|re.S)
            label=re.sub(r'\s+',' ',m.group(1)).strip() if m else p.stem.replace('-',' ').title()
            href=route_map.get(p.name,'/'+p.name)
            pages.append({'file':p.name,'href':href,'label':label,'shortLabel':short_map.get(p.name,label.split(' | ')[0][:22])})
            css='<link rel="stylesheet" href="/global-2026.css">'
            mapjs='<script src="/site-pages.js" defer></script>'
            ui='<script src="/global-ui.js" defer></script>'
            if css not in text:
              text=text.replace('</head>',f'  {css}\n</head>')
            if mapjs not in text:
              text=text.replace('</body>',f'  {mapjs}\n  {ui}\n</body>')
            elif ui not in text:
              text=text.replace('</body>',f'  {ui}\n</body>')
            p.write_text(text,encoding='utf-8')
          Path('site-pages.js').write_text('window.__SITE_PAGES__ = '+json.dumps(pages,separators=(',',':'))+';\n',encoding='utf-8')
          print('Pages:',*[x['file'] for x in pages],sep='\n- ')
          PY
      - name: Commit site-wide UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' site-pages.js
          git diff --cached --quiet || git commit -m "Apply shared 2026 UI across site"
          git push
