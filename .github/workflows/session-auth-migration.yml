name: Session auth migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.event.head_commit.message != 'Use named sessions across public-chain tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch legacy session authorization
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old in s:
                  s=s.replace(old,new)
                  p.write_text(s)
                  print('patched', path)
              else:
                  print('pattern not found', path)

          # BTC preview
          p=Path('api/btc-preview.mjs'); s=p.read_text()
          if "from './_auth.mjs'" not in s:
              s="import { authorizeSessionOrApp } from './_auth.mjs';\n"+s
          old="""  const expected = process.env.APP_ACCESS_TOKEN;\n  if (expected && !safeTokenEqual(request.headers['x-app-access-token'], expected)) {\n    return send(response, 401, { error: 'Incorrect or missing app passcode.' });\n  }\n"""
          new="""  try { await authorizeSessionOrApp(request); } catch (error) {\n    return send(response, error.status || 401, { error: error.message || 'Authentication required.' });\n  }\n"""
          s=s.replace(old,new); p.write_text(s)

          # Resilient BTC discovery
          p=Path('api/btc-discovery-v3.mjs'); s=p.read_text()
          if "from './_auth.mjs'" not in s:
              s="import { authorizeSessionOrApp } from './_auth.mjs';\n"+s
          old="""  const configuredToken = process.env.APP_ACCESS_TOKEN;\n  if (configuredToken && !safeTokenEqual(request.headers['x-app-access-token'], configuredToken)) {\n    return send(response, 401, { error: 'Incorrect or missing app passcode.' });\n  }\n"""
          if old not in s:
              old="""  const expected = process.env.APP_ACCESS_TOKEN;\n  if (expected && !safeTokenEqual(request.headers['x-app-access-token'], expected)) {\n    return send(response, 401, { error: 'Incorrect or missing app passcode.' });\n  }\n"""
          s=s.replace(old,"""  try { await authorizeSessionOrApp(request); } catch (error) {\n    return send(response, error.status || 401, { error: error.message || 'Authentication required.' });\n  }\n"""); p.write_text(s)

          # Small APIs with standard token guard
          for path in ['api/btc-inspect.mjs','api/check-address.mjs','api/audit-addresses.mjs','api/btc-index.mjs','api/btc-analytics.mjs']:
              p=Path(path)
              if not p.exists(): continue
              s=p.read_text()
              if "from './_auth.mjs'" not in s:
                  s="import { authorizeSessionOrApp } from './_auth.mjs';\n"+s
              patterns=[
                "const ex=process.env.APP_ACCESS_TOKEN;if(ex&&!eq(req.headers['x-app-access-token'],ex))return send(res,401,{error:'Incorrect or missing app passcode.'});",
                "const expected=process.env.APP_ACCESS_TOKEN;if(expected&&!eq(req.headers['x-app-access-token'],expected))return send(res,401,{error:'Incorrect or missing app passcode.'});",
                "const token = process.env.APP_ACCESS_TOKEN;\n  if (!token) return send(response, 503, { error: \"Recovery auditing requires APP_ACCESS_TOKEN.\" });\n  if (!safeTokenEqual(request.headers[\"x-app-access-token\"], token)) {\n    return send(response, 401, { error: \"Incorrect or missing app passcode.\" });\n  }",
              ]
              replacement="try{await authorizeSessionOrApp(req||request)}catch(e){return send(res||response,e.status||401,{error:e.message||'Authentication required.'})}"
              for pat in patterns:
                  if pat in s:
                      # use explicit request object per file to avoid undeclared identifier evaluation
                      obj='request' if 'request, response' in s or 'request,response' in s else 'req'
                      rsp='response' if obj=='request' else 'res'
                      s=s.replace(pat,f"try{{await authorizeSessionOrApp({obj})}}catch(e){{return send({rsp},e.status||401,{{error:e.message||'Authentication required.'}})}}")
              p.write_text(s)

          # Recovery audit no longer requires the user to know APP_ACCESS_TOKEN.
          p=Path('recovery.js'); s=p.read_text()
          s=s.replace("""      if (!recoveryAccessToken.value) {\n        throw new Error('Enter the private APP_ACCESS_TOKEN configured in Vercel.');\n      }\n""","")
          p.write_text(s)
          PY
      - name: Validate JavaScript modules
        run: |
          node --check api/btc-preview.mjs
          node --check api/btc-discovery-v3.mjs
          node --check api/btc-inspect.mjs
          node --check api/check-address.mjs
          node --check api/audit-addresses.mjs
          node --check recovery.js
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/ recovery.js
          git diff --cached --quiet || git commit -m "Use named sessions across public-chain tools"
          git push
