name: Integrate EVM background audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate EVM background audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire EVM background feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          marker='  <script src="/evm-background.js" defer></script>\n'
          if marker not in s:
              s=s.replace('  <script src="/generator.js" defer></script>\n', '  <script src="/generator.js" defer></script>\n'+marker)
              p.write_text(s)
          p=Path('vercel.json')
          d=json.loads(p.read_text())
          funcs=d.setdefault('functions',{})
          funcs['api/evm-background-jobs.mjs']={'maxDuration':30}
          funcs['api/evm-background-worker.mjs']={
            'maxDuration':300,
            'experimentalTriggers':[{
              'type':'queue/v2beta',
              'topic':'evm-background-audit',
              'retryAfterSeconds':60,
              'initialDelaySeconds':0
            }]
          }
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json
          git diff --cached --quiet || git commit -m "Integrate EVM background audit"
          git push
